<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register | Market2</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white sticky-top shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="index.html">Market2</a>
        <div class="ms-auto">
          <a class="btn btn-outline-primary" href="login.html">Login</a>
        </div>
      </div>
    </nav>

    <section class="py-5">
      <div class="container">
        <div class="card p-4 auth-card fade-in">
          <div class="text-center mb-4">
            <span class="icon-circle mb-3"><i class="fa-solid fa-user-plus"></i></span>
            <h2 class="section-title">Create your account</h2>
            <p class="text-muted">Get started with a 14-day demo workspace.</p>
          </div>
          <form data-form="mock">
            <div class="mb-3">
              <label class="form-label" for="registerName">Full name</label>
              <input class="form-control" id="registerName" type="text" placeholder="Taylor Jordan" required />
            </div>
            <div class="mb-3">
              <label class="form-label" for="registerEmail">Work email</label>
              <input class="form-control" id="registerEmail" type="email" placeholder="taylor@company.com" required />
            </div>
            <div class="mb-3">
              <label class="form-label" for="registerCompany">Company</label>
              <input class="form-control" id="registerCompany" type="text" placeholder="Market2 Labs" required />
            </div>
            <div class="mb-3">
              <label class="form-label" for="registerPassword">Password</label>
              <input class="form-control" id="registerPassword" type="password" placeholder="••••••••" required />
            </div>
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="policyCheck" required />
              <label class="form-check-label" for="policyCheck">
                I agree to the Terms & Privacy Policy.
              </label>
            </div>
            <button class="btn btn-primary w-100" type="submit">Create account</button>
          </form>
          <p class="text-center small text-muted mt-3">
            Already have an account? <a href="login.html">Login</a>
          </p>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
