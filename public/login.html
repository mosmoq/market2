<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | Market2</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white sticky-top shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="index.html">Market2</a>
        <div class="ms-auto">
          <a class="btn btn-outline-primary" href="register.html">Create account</a>
        </div>
      </div>
    </nav>

    <section class="py-5">
      <div class="container">
        <div class="card p-4 auth-card fade-in">
          <div class="text-center mb-4">
            <span class="icon-circle mb-3"><i class="fa-solid fa-user-lock"></i></span>
            <h2 class="section-title">Welcome back</h2>
            <p class="text-muted">Sign in to your Market2 workspace.</p>
          </div>
          <form data-form="mock">
            <div class="mb-3">
              <label class="form-label" for="loginEmail">Email address</label>
              <input class="form-control" id="loginEmail" type="email" placeholder="you@company.com" required />
            </div>
            <div class="mb-3">
              <label class="form-label" for="loginPassword">Password</label>
              <input class="form-control" id="loginPassword" type="password" placeholder="••••••••" required />
            </div>
            <div class="d-flex justify-content-between align-items-center mb-3">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe" />
                <label class="form-check-label" for="rememberMe">Remember me</label>
              </div>
              <a href="contact.html" class="small text-decoration-none">Forgot password?</a>
            </div>
            <button class="btn btn-primary w-100" type="submit">Login</button>
          </form>
          <p class="text-center small text-muted mt-3">
            New to Market2? <a href="register.html">Create an account</a>
          </p>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
